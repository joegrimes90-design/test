<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink check</title>
<!-- tests/webkit/ink.test.mjs: each sprite three times, side by side:
       game   the game's own sprite (a game Node, through the bitmap layer, or ?raster=svg)
       noink  its SVG with the ink lines taken out
       plain  its SVG with the ink lines drawn without their filter
     Where "game" is darker than "noink" is the ink that shows; "plain" says how much there is. -->
<link rel="stylesheet" href="../../css/style.css">
<style>
  html, body { overflow: hidden; height: auto; margin: 0; background: #fff; }
  #page, #refs { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; }
  #refs img { position: absolute; }
</style>
</head>
<body>
<div id="page"></div>
<div id="refs"></div>
<script src="../../js/art-core.js"></script>
<script src="../../js/art-characters.js"></script>
<script src="../../js/art-props.js"></script>
<script src="../../js/art-scenes.js"></script>
<script src="../../js/engine.js"></script>
<script src="../../js/game.js"></script>
<script>
  // An ink line: a path or text with one of the ink filters (k, ks, ke and their per-transform copies).
  var INK_EL = /<(path|text)\b[^>]*filter="url\(#k[se]?(?:_\d+)?\)"[^>]*?(?:\/>|>[^<]*<\/text>)/g;
  var INK_ATTR = / filter="url\(#k[se]?(?:_\d+)?\)"/g;
  function svgImg(text, x, y, w, h) {
    var im = new Image();
    im.style.left = x + 'px'; im.style.top = y + 'px'; im.style.width = w + 'px'; im.style.height = h + 'px';
    im.src = URL.createObjectURL(new Blob([text], { type: 'image/svg+xml' }));
    document.getElementById('refs').appendChild(im);
    return im.decode();
  }
  // cells: [{id, s, x, y}] (CSS px): game at x, noink at x + w + gap, plain at x + 2 (w + gap)
  window.render = async function (cells, gap) {
    var root = document.getElementById('page');
    var waits = [];
    var out = cells.map(function (c) {
      var b = AT.art.box(c.id), w = Math.ceil(b[2] * c.s), h = Math.ceil(b[3] * c.s);
      AT.engine.node(root, { sprite: c.id }).set({ x: c.x - b[0] * c.s, y: c.y - b[1] * c.s, s: c.s });
      var svg = AT.art.svgOf(c.id);
      var inkLines = (svg.match(INK_EL) || []).length;
      waits.push(svgImg(svg.replace(INK_EL, ''), c.x + w + gap, c.y, b[2] * c.s, b[3] * c.s));
      waits.push(svgImg(svg.replace(INK_ATTR, ''), c.x + 2 * (w + gap), c.y, b[2] * c.s, b[3] * c.s));
      return { id: c.id, x: c.x, y: c.y, w: w, h: h, inkLines: inkLines };
    });
    await Promise.all(waits);
    await AT.art.fit(root);
    await AT.art.idle();
    await AT.imagesReady(document.body, 60000);
    await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
    var imgs = root.querySelectorAll('img[data-sprite]');
    return { cells: out, mode: AT.art.mode, bitmaps: root.querySelectorAll('img[data-k]').length, imgs: imgs.length, dpr: devicePixelRatio, innerWidth: innerWidth };
  };
  // Gradient energy of each sprite's bitmap at scale k as the bitmap layer paints it, and of its SVG
  // drawn into a canvas at k the plain way (drawImage of the 1x image, which WebKit magnifies), both
  // over white: [{id, game, plain}]. (tests/webkit/ink.test.mjs: WebKit's bitmaps are not magnified)
  window.sharpness = async function (ids, k) {
    var load = function (u) { return new Promise(function (ok, no) { var im = new Image(); im.onload = function () { ok(im); }; im.onerror = no; im.src = u; }); };
    var energy = function (im, w, h, dw, dh) {
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var g = c.getContext('2d', { willReadFrequently: true });
      g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
      g.drawImage(im, 0, 0, dw, dh);
      var d = g.getImageData(0, 0, w, h).data, L = new Float32Array(w * h), e = 0;
      for (var i = 0; i < w * h; i++) L[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2];
      for (var y = 0; y < h - 1; y++) for (var x = 0; x < w - 1; x++) { var a = L[y * w + x], gx = L[y * w + x + 1] - a, gy = L[(y + 1) * w + x] - a; e += gx * gx + gy * gy; }
      return e / (w * h);
    };
    var out = [];
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i], b = AT.art.box(id);
      var e = await AT.art.rasterize(id, k);
      if (!e) { out.push({ id: id, game: 0, plain: 0 }); continue; }
      var bm = await load(e.url);
      var svg = await load(AT.art.url(id));
      out.push({ id: id, game: energy(bm, e.cw, e.ch, e.cw, e.ch), plain: energy(svg, e.cw, e.ch, b[2] * k, b[3] * k) });
    }
    return { rows: out, sized: AT.art.sized, mode: AT.art.mode };
  };
  // Each sprite's bitmap at scale k as the bitmap layer makes it (where it paints on the page's thread, the PNG
  // is encoded by a worker: js/art-core.js encodeOff) and the same painting encoded here with toDataURL, both
  // decoded the same way: [{id, w, h, differ}] (differ: bytes of the RGBA pixels that are not the same).
  window.encoded = async function (ids, k) {
    var load = function (u) { return new Promise(function (ok, no) { var im = new Image(); im.onload = function () { ok(im); }; im.onerror = no; im.src = u; }); };
    var pixels = function (im, w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; var g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(im, 0, 0); return g.getImageData(0, 0, w, h).data; };
    var out = [];
    for (var i = 0; i < ids.length; i++) {
      var e = await AT.art.rasterize(ids[i], k);
      var cv = await AT.art.paintCanvas(ids[i], k);
      var a = pixels(await load(e.url), e.cw, e.ch), b = pixels(await load(cv.toDataURL('image/png')), e.cw, e.ch), n = 0;
      for (var j = 0; j < a.length; j++) if (a[j] !== b[j]) n++;
      out.push({ id: ids[i], w: e.cw, h: e.ch, cw: cv.width, ch: cv.height, differ: n });
    }
    var log = AT.art.bakeLog();
    return { rows: out, off: log.filter(function (x) { return x.off; }).length, painted: log.length };
  };
  window.__ready = true;
</script>
</body>
</html>
